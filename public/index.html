<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Bus Booking System</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <nav>
      <a href="#" id="loginNav" class="active">Login</a>
      <a href="#" id="signupNav">Signup</a>
      <a href="#" id="historyNav" class="hidden">Booking History</a>
      <a href="#" id="busBookingNav" class="hidden">Bus Booking</a>

    </nav>
    <main>
      <!-- Login Form -->
      <div id="loginForm" class="form-container">
        <h2>Login</h2>
        <form id="login">
          <div class="form-group">
            <input type="email" id="loginEmail" placeholder="Email" required>
          </div>
          <div class="form-group">
            <input type="password" id="loginPassword" placeholder="Password" required>
          </div>
          <button type="submit">Login</button>
        </form>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" class="form-container hidden">
        <h2>Signup</h2>
        <form id="signup">
          <div class="form-group">
            <input type="text" id="signupName" placeholder="Full Name" required>
          </div>
          <div class="form-group">
            <input type="email" id="signupEmail" placeholder="Email" required>
          </div>
          <div class="form-group">
            <input type="password" id="signupPassword" placeholder="Password" required>
          </div>
          <button type="submit">Signup</button>
        </form>
      </div>

      <!-- Booking History -->
      <div id="bookingHistory" class="form-container hidden">
        <h2>Your Booking History</h2>
        <div id="historyContainer"></div>
      </div>

      <!-- Bus Search Form (Initially Hidden) -->
      <div id="busSearchForm" class="form-container hidden">
        <h2>Search Bus</h2>
        <form id="busSearch">
          <div class="form-group">
            <select id="fromCity" required>
              <option value="">Select From City</option>
              <option value="delhi">Delhi</option>
              <option value="mumbai">Mumbai</option>
              <option value="bangalore">Bangalore</option>
              <option value="chennai">Chennai</option>
              <option value="kolkata">Kolkata</option>
              <option value="hyderabad">Hyderabad</option>
              <option value="hyderabad">Guntur</option>
              <option value="hyderabad">Ongole</option>
              <option value="hyderabad">Salem</option>
            </select>
          </div>
          <div class="form-group">
            <select id="toCity" required>
                <option value="">Select From City</option>
                <option value="delhi">Delhi</option>
                <option value="mumbai">Mumbai</option>
                <option value="bangalore">Bangalore</option>
                <option value="chennai">Chennai</option>
                <option value="kolkata">Kolkata</option>
                <option value="hyderabad">Hyderabad</option>
                <option value="hyderabad">Guntur</option>
                <option value="hyderabad">Ongole</option>
                <option value="hyderabad">Salem</option>
            </select>
          </div>
          <div class="form-group">
            <input type="date" id="travelDate" required>
          </div>
          <button type="submit">Search Buses</button>
        </form>
      </div>

      <!-- Bus List (Initially Hidden) -->
      <div id="busList" class="form-container hidden">
        <h2>Available Buses</h2>
        <div id="busListContainer"></div>
      </div>

      <!-- Booking Form (Initially Hidden) -->
      <div id="bookingForm" class="form-container hidden">
        <h2>Book Ticket</h2>
        <form id="booking">
          <div class="form-group">
            <input type="text" id="passengerName" placeholder="Passenger Name" required>
          </div>
          <div class="form-group">
            <input type="tel" id="phoneNumber" placeholder="Phone Number" required>
          </div>
          <div class="form-group">
            <input type="email" id="passengerEmail" placeholder="Email" required>
          </div>
          <div class="form-group">
            <input type="number" id="age" placeholder="Enter your age">
          </div>
          <div class="form-group">
            <select id="gender" required>
              <option value="">Select Gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
          <button type="submit">Book Ticket</button>
        </form>
      </div>

      <!-- Ticket Display (Initially Hidden) -->
      <div id="ticketDisplay" class="form-container hidden">
        <h2>Booking Confirmed!</h2>
        <div id="ticketContent" class="ticket">
          <!-- Ticket content will be inserted here -->
        </div>
        <button id="downloadTicket" class="secondary-button">Download PDF Ticket</button>
        <button id="backToSearch" class="secondary-button">Book Another Ticket</button>
      </div>
    </main>
  </body>
</html>
